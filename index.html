<style>
  :root {

  /* ---- 右下のボタン ---- */

  /* 攻撃と回避。右の親指が届く位置に置く */

  #inv-tabs button.on { border-color: #5b8dd9; color: var(--text); background: rgba(44, 60, 92, .9); }

  .card {

  /* 職業カードの挿絵。画像が無い職はJS側で丸ごと消える */
  .class-art {

  /* タイトル */
  /* 背景とロゴは生成イラスト（prompts/ 参照）。

  #title {

  #title-head { text-align: center; margin-bottom: 18px; }

  #title.intro { cursor: pointer; }

  .title-note { color: var(--dim); font-size: 14px; margin-bottom: 10px; text-align: center; }
  .title-foot { color: var(--dim); font-size: 13px; text-align: center; margin-top: 12px; }

  /* 技能ツリー */
  /* 1本の大樹。9本の小枝は画面に収まらないので、
     技能画面の本文そのものを縦横スクロールにして1本指で斜めに動かす。
     入れ子のスクロールにすると縦と横で指の担当が分かれて操作が難しくなる */
  #pv-list { overflow: auto; touch-action: pan-x pan-y; }
  .tree-scroll { overflow: visible; }
  .tree-canvas { width: 860px; position: relative; }
  .tree-canvas > :not(.tree-bg) { position: relative; z-index: 1; }
  /* 世界樹のイラスト。ノードの後ろで、根から樹冠へ登る絵になる */
  .tree-bg {
    position: absolute;
    inset: 0;
    background: url('art/guide_passives.webp') center bottom / cover no-repeat;
    opacity: .55;
  }
  .tree-bg::after {
    /* 文字が絵に喰われないように全体を沈める。中腹だけ少し絵を透かす */
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      rgba(10, 11, 15, .78),
      rgba(10, 11, 15, .5) 45%,
      rgba(10, 11, 15, .8)
    );
  }
  /* 小枝そのもの。ノードの後ろを1本の枝が貫く。
     枝の線はノードが生えている区間（chain）だけに走らせる */
  .path-chain { position: relative; }
  .path-chain::before {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 26px;
    left: 50%;

<div id="death-pop" class="tip-pop hidden" style="z-index: 65; border-color: #a04048; text-align: center">
  <div class="tip-title" style="color: #ff6b6b">倒れた</div>
  <div class="tip-body">経験値を失った。<span id="death-count">3</span>秒後に立ち上がる……</div>
</div>

<div id="update-pop" class="tip-pop hidden" style="z-index: 70; text-align: left; max-width: min(420px, 92vw)">
  <div class="tip-title">更新情報 <span id="update-ver" style="opacity:.6; font-size: 12px"></span></div>
  <div id="update-body" class="tip-body" style="max-height: 50vh; overflow-y: auto"></div>
  <button type="button" id="update-ok" class="tip-ok">OK</button>
  <button type="button" id="update-mute" class="stash-btn" style="margin-top:6px">次回から自動で出さない</button>
</div>

<div id="gate-pop" class="gate-pop hidden">
  <div id="gate-pop-title" class="gate-pop-title"></div>
  <div id="gate-pop-body" class="gate-pop-body"></div>
</div>

<div id="texts"></div>

<div class="panel" id="stats">
  <button class="panel-head" type="button" data-panel="stats">ステータス<span class="caret">▾</span></button>
  <div class="panel-body" id="stats-body"></div>
</div>
<div class="panel" id="gear">
  <!--
    畳んでいる間も、今つけているものが分かるようにアイコンを並べる。
    見出しだけだと「装備」としか出ず、遊んでいる最中に何を着ているか分からない。
  -->
  <button class="panel-head" type="button" data-panel="gear">
    装備<span class="gear-strip" id="gear-strip"></span><span class="caret">▾</span>
  </button>
  <div class="panel-body" id="gear-body"></div>
</div>

<div id="vitals">
  <svg id="heart" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <clipPath id="heart-clip">
        <path d="M50 92 C18 68, 2 47, 2 29 C2 13, 14 3, 28 3 C38 3, 46 9, 50 17 C54 9, 62 3, 72 3 C86 3, 98 13, 98 29 C98 47, 82 68, 50 92 Z" />
      </clipPath>
    </defs>
    <g clip-path="url(#heart-clip)">
      <rect x="0" y="0" width="100" height="100" fill="#2b2028" />
      <rect id="heart-fill" x="0" y="0" width="100" height="100" fill="var(--hp)" />
    </g>
    <path d="M50 92 C18 68, 2 47, 2 29 C2 13, 14 3, 28 3 C38 3, 46 9, 50 17 C54 9, 62 3, 72 3 C86 3, 98 13, 98 29 C98 47, 82 68, 50 92 Z"
          fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" />
    <text id="heart-value" x="50" y="56">100</text>
  </svg>

  <!--
    ポーション。残りが液面の高さで見える小瓶。
    数字を読まなくても「あと少し」が分かるようにする。
    ハートと同じく、器の形で切り抜いて中身を下から満たす作り。
  -->
  <div id="potions">
    <button id="potion-hp" class="bottle" type="button" aria-label="HPポーション">
      <svg viewBox="0 0 40 60" aria-hidden="true">
        <defs>
          <clipPath id="bottle-clip-hp">
            <path d="M14 5 L26 5 L26 14 L32 22 L32 48 Q32 55 25 55 L15 55 Q8 55 8 48 L8 22 L14 14 Z" />
          </clipPath>
        </defs>
        <g clip-path="url(#bottle-clip-hp)">
          <rect x="0" y="0" width="40" height="60" fill="rgba(20,16,20,.85)" />
          <rect class="liquid" id="potion-hp-liquid" x="0" y="55" width="40" height="0" fill="var(--hp)" />
        </g>
        <path class="glass" d="M14 5 L26 5 L26 14 L32 22 L32 48 Q32 55 25 55 L15 55 Q8 55 8 48 L8 22 L14 14 Z" />
        <rect class="cork" x="13" y="0" width="14" height="6" rx="2" />
        <text class="count" id="potion-hp-count" x="20" y="42">0</text>
      </svg>
    </button>

    <button id="potion-mana" class="bottle" type="button" aria-label="マナポーション">
      <svg viewBox="0 0 40 60" aria-hidden="true">
        <defs>
          <clipPath id="bottle-clip-mana">
            <path d="M14 5 L26 5 L26 14 L32 22 L32 48 Q32 55 25 55 L15 55 Q8 55 8 48 L8 22 L14 14 Z" />
          </clipPath>
        </defs>
        <g clip-path="url(#bottle-clip-mana)">
          <rect x="0" y="0" width="40" height="60" fill="rgba(18,16,26,.85)" />
          <rect class="liquid" id="potion-mana-liquid" x="0" y="55" width="40" height="0" fill="#7a5cd8" />
        </g>
        <path class="glass" d="M14 5 L26 5 L26 14 L32 22 L32 48 Q32 55 25 55 L15 55 Q8 55 8 48 L8 22 L14 14 Z" />
        <rect class="cork" x="13" y="0" width="14" height="6" rx="2" />
        <text class="count" id="potion-mana-count" x="20" y="42">0</text>
      </svg>
    </button>
  </div>

  <div id="level-box">
    <div id="level-num">Lv <span id="level-value">1</span></div>
    <div id="exp-track"><i id="exp-fill"></i></div>
    <div id="mana-track"><i id="mana-fill"></i></div>
    <div id="points-note" class="hidden">ポイント <b id="points-value">0</b></div>
  </div>
</div>

<div id="buttons">
  <button id="btn-inv" type="button">装備<span class="badge zero" id="inv-badge">0</span></button>
  <button id="btn-passive" type="button">技能<span class="badge zero" id="passive-badge">0</span></button>
  <button id="btn-town" type="button" class="hidden">街<span class="badge zero" id="town-badge">0</span></button>
  <button id="btn-settings" type="button">設定</button>
</div>

<div id="stick"><div id="knob"></div></div>

<div id="actions">
  <button id="btn-dodge" type="button">回避</button>
  <div id="skills"></div>
  <div id="attack-stack">
    <button id="btn-auto" type="button">AUTO</button>
    <button id="btn-attack" type="button">攻撃</button>
  </div>
</div>

<div id="inventory" class="modal hidden">
  <div class="modal-head">
    <h1>装備</h1>
    <button id="inv-close" type="button">閉じる</button>
  </div>
  <div id="inv-stats"></div>
  <div id="inv-tabs"></div>
  <div id="inv-list" class="modal-body"></div>
</div>

<div id="passives" class="modal hidden">
  <div class="modal-head">
    <h1>技能</h1>
    <button id="pv-close" type="button">閉じる</button>
  </div>
  <div id="pv-head"></div>
  <div id="pv-list" class="modal-body"></div>
</div>

<div id="title" class="modal">
  <div id="title-head">
    <img id="title-logo" src="art/title_logo.webp" alt="D.E.M.O — Divine Echo: Mourning Order">
    <p id="title-hint">タップして始める</p>
  </div>
  <div id="title-body" class="modal-body">
    <div id="title-classes"></div>
  </div>
  <div class="title-foot">あとから設定でやり直せる（最初から始まる）</div>
</div>

<div id="classpick" class="modal hidden">
  <div class="modal-head">
    <h1>職業を変える</h1>
    <button id="pick-close" type="button">やめる</button>
  </div>
  <div class="hint" style="color:var(--dim);margin-bottom:10px">選んだ職で初期武器・伸びるステータス・使えるスキルが変わる。あとから設定で変更できる（最初からやり直しになる）。</div>
  <div id="class-list" class="modal-body"></div>
</div>

<div id="town" class="modal hidden">
  <div class="modal-head">
    <h1>街</h1>
    <button id="town-close" type="button">閉じる</button>
  </div>
  <div id="town-head"></div>
  <div id="town-tabs" class="tabs"></div>
  <div id="town-list" class="modal-body"></div>
</div>

<div id="boons" class="modal hidden">
  <div class="modal-head">
    <h1>覚悟</h1>
    <button id="boon-close" type="button">あとで選ぶ</button>
  </div>
  <div id="boon-head"></div>
  <div id="boon-list" class="modal-body"></div>
</div>

<div id="settings" class="modal hidden">
  <div class="modal-head">
    <h1>設定</h1>
    <button id="set-close" type="button">閉じる</button>
  </div>
  <div id="set-list" class="modal-body"></div>
  <button id="set-class" type="button" style="margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(40,34,62,.9);color:var(--text);font:inherit;cursor:pointer">職業を変える（最初からやり直し）</button>
</div>
